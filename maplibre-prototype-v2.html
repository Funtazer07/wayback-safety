<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>WayBack route prototype V2</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="maplibre-prototype/v2.css" />
  </head>
  <body>
    <div id="map" role="region" aria-label="Map of Eindhoven"></div>

    <section class="panel" id="panel" aria-label="Plan your walk">
      <h1>WayBack route prototype V2</h1>
      <p class="hint" id="hint"></p>
      <p class="status" role="status" id="status"></p>
      <div class="row">
        <button type="button" class="button-primary" id="locate">My location</button>
        <button type="button" id="clear">Start over</button>
        <label class="visually-hidden" for="style-picker">Map style</label>
        <select class="style-picker" id="style-picker">
          <option value="street">Street</option>
          <option value="detailed">Detailed</option>
          <option value="night">Night</option>
        </select>
      </div>
    </section>

    <section class="routes" id="routes" aria-labelledby="routes-title" hidden>
      <h2 id="routes-title">Choose a route</h2>
      <div class="route-list" id="route-list"></div>
      <p class="routes-note">
        Lights within 25 m of the route, from the municipality's register: where lamps stand, not
        whether they are on.
      </p>
    </section>

    <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
    <script src="maplibre-prototype/v2.js"></script>
  </body>
</html>
