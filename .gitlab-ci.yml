# Runs on every merge request and on main. All jobs must pass before merge.
# Deployment is added in SCRUM-37.
image: node:24

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

before_script:
  - npm ci --cache .npm --prefer-offline

stages:
  - check
  - build

lint:
  stage: check
  script:
    - npm run lint
    - npm run format:check

typecheck:
  stage: check
  script:
    - npm run typecheck

test:
  stage: check
  script:
    - npm run test

build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
