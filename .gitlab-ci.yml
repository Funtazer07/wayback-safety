# Runs on every merge request and on main. All jobs must pass before merge.
# On main, the build is then deployed to Netlify (see docs/deployment.md).
image: node:24

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

before_script:
  - npm ci --cache .npm --prefer-offline

stages:
  - check
  - build
  - deploy

lint:
  stage: check
  script:
    - npm run lint
    - npm run format:check

typecheck:
  stage: check
  script:
    - npm run typecheck

test:
  stage: check
  script:
    - npm run test

build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# Uploads the dist/ folder from the build job. Needs the CI/CD variables NETLIFY_AUTH_TOKEN and
# NETLIFY_SITE_ID (Settings > CI/CD > Variables). They are secrets: never put them in the repo.
deploy:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - job: build
      artifacts: true
  before_script: []
  script:
    - npx --yes netlify-cli deploy --prod --no-build --dir=dist
  environment:
    name: production
