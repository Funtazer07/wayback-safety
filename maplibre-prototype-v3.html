<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>WayBack route prototype V3</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="maplibre-prototype/v3.css" />
  </head>
  <body>
    <div id="map" role="region" aria-label="Map of Eindhoven"></div>

    <section class="panel" id="panel" aria-label="Plan your walk">
      <h1>WayBack route prototype V3</h1>
      <p class="hint" id="hint"></p>
      <p class="status" role="status" id="status"></p>
      <div class="row">
        <button type="button" class="button-primary" id="locate">My location</button>
        <button type="button" id="clear">Start over</button>
        <label class="visually-hidden" for="style-picker">Map style</label>
        <select class="style-picker" id="style-picker">
          <option value="detailed" selected>Detailed</option>
          <option value="street">Street</option>
          <option value="night">Night</option>
        </select>
      </div>
    </section>

    <section class="routes" id="routes" aria-labelledby="routes-title" hidden>
      <h2 id="routes-title">Choose a route</h2>
      <div class="route-list" id="route-list"></div>
      <p class="routes-note">
        Counted from the municipality's register: where lamps stand, not whether they are on. Lights
        reported as broken do not count.
      </p>
    </section>

    <!-- The chosen route, once the list is closed. -->
    <section class="route-summary" id="route-summary" aria-label="Your route" hidden>
      <div class="summary-text" id="route-summary-text"></div>
      <button type="button" id="other-routes">Other routes</button>
    </section>

    <!-- Opens after pressing and holding the map. -->
    <section
      class="report-sheet"
      id="report-sheet"
      role="dialog"
      aria-labelledby="report-title"
      hidden
    >
      <h2 id="report-title">Report a problem here</h2>
      <button type="button" class="report-option" id="report-broken-light" disabled>
        <span class="report-option-icon" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"
            />
            <path d="M9 18h6" />
            <path d="M10 22h4" />
            <path d="M3 3l18 18" />
          </svg>
        </span>
        <span class="report-option-text">
          <strong>Broken street light</strong>
          <span id="report-lamp"></span>
        </span>
      </button>
      <p class="report-note">
        Prototype: reports are saved on this device only, not shared with others yet.
      </p>
      <button type="button" id="report-cancel">Cancel</button>
    </section>

    <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
    <script src="maplibre-prototype/v3.js"></script>
  </body>
</html>
